<main id="main" class="page-posts-list">
  <section class="posts posts--all">
    <header class="posts-head">
      <div>
        <p class="kicker">Posts</p>
        <h1 class="h2">Tous les posts</h1>
        <p class="lead">Mes publications X et LinkedIn, classées par date.</p>
      </div>
    </header>
    <ol class="posts-archive">
      {% for p in posts %}
      <li>
        <article>
          <p class="meta-line"><span class="src {{ p.source }}">{{ p.source_label }}</span> · <time datetime="{{ p.date_iso }}">{{ p.dateLabel }}</time>{% if p.pinned %} · <span class="pin">Épinglé</span>{% endif %}</p>
          <h2><a href="/posts/{{ p.slug }}/">{{ p.title }}</a></h2>
          <p class="excerpt">{{ p.excerpt }}</p>
        </article>
      </li>
      {% endfor %}
    </ol>
    <p class="back-home"><a href="/">← Retour à l'accueil</a></p>
  </section>
</main>
