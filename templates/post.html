<main id="main" class="page-post">
  <article class="post-single" itemscope itemtype="https://schema.org/BlogPosting">
    <header class="post-single-head">
      <p class="kicker"><a href="{{ href('/posts/') }}">Posts</a></p>
      <p class="meta-line">
        <span class="src {{ post.source }}">{{ post.source_label }}</span>
        · <time datetime="{{ post.date_iso }}" itemprop="datePublished">{{ post.dateLabel }}</time>
      </p>
      <h1 itemprop="headline">{{ post.title|fr }}</h1>
    </header>
    {% if post.image %}
    <figure class="post-single-media">
      <img src="{{ href('/' ~ post.image) }}" alt="" loading="lazy" decoding="async" itemprop="image">
    </figure>
    {% elif post.figure %}
    <p class="post-single-figure"><b>{{ post.figure.big }}</b><span>{{ post.figure.small }}</span></p>
    {% endif %}
    <div class="post-single-body" itemprop="articleBody">
      {% for para in post.paragraphs %}
      <p>{{ para|fr }}</p>
      {% endfor %}
    </div>
    <footer class="post-single-foot">
      <a class="src-link" href="{{ post.url }}" target="_blank" rel="noreferrer">Voir sur {{ post.source_label }} ↗</a>
      <a class="text-link" href="{{ href('/posts/') }}">Tous les posts</a>
    </footer>
  </article>
</main>
